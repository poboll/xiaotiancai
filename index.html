<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾遗馆</title>
<meta name="description" content="小天才（余乐彤）作品归档，以及一封没寄出的信。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/site.css?v=6">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" id="site-name">拾遗馆</a>
    <nav class="nav">
      <a href="story.html">我为什么收这些</a>
      <a href="#gallery">作品</a>
      <a href="works/longlong-xiaotiancai/index.html">那封信</a>
    </nav>
  </div>
</div>

<main>

  <!-- ── 封面 ── -->
  <section class="hero">
    <div class="wrap">
      <h1 id="hero-name">拾遗馆</h1>
      <div class="hero-rule"></div>
      <p class="tagline" id="site-tagline"></p>
      <p class="tagline dim" id="site-intro"></p>
      <div class="count" id="site-count"></div>
    </div>
  </section>

  <!-- ── 故事摘要 ── -->
  <section class="teaser">
    <div class="wrap">
      <div class="teaser-inner">
        <div class="teaser-mark">“</div>
        <div id="story-teaser"></div>
        <a class="more" href="story.html">剩下的在这儿　→</a>
      </div>
    </div>
  </section>

  <!-- ── 归档 ── -->
  <section class="wrap" id="gallery">
    <div class="gallery-head">
      <h3 class="section-title">作品归档</h3>
      <p class="section-note" id="gallery-note"></p>
    </div>

    <div class="pinned" id="pinned"></div>

    <div class="filterbar">
      <div class="filters" id="filters" role="tablist"></div>
      <div class="funnel">
        <span class="funnel-state" id="funnel-state"></span>
        <button class="funnel-btn" id="funnel-btn" type="button" aria-expanded="false" aria-controls="funnel-panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/>
          </svg>
          <span>筛选</span>
          <em class="funnel-dot" id="funnel-dot" hidden></em>
        </button>
        <div class="funnel-panel" id="funnel-panel" hidden>
          <div class="fp-row">
            <div class="fp-label">平台</div>
            <div class="fp-opts" id="fp-platform">
              <button type="button" data-v="all" class="on">全部</button>
              <button type="button" data-v="抖音">抖音</button>
              <button type="button" data-v="小红书">小红书</button>
              <button type="button" data-v="双平台">双平台</button>
            </div>
          </div>
          <div class="fp-row">
            <div class="fp-label">排序</div>
            <div class="fp-opts" id="fp-sort">
              <button type="button" data-v="new" class="on">时间倒序</button>
              <button type="button" data-v="old">时间正序</button>
              <button type="button" data-v="hot">按热度</button>
            </div>
          </div>
          <div class="fp-foot">
            <span id="fp-count"></span>
            <button type="button" id="fp-reset">重置</button>
          </div>
        </div>
      </div>
    </div>

    <div class="masonry" id="masonry"></div>

    <p class="empty" id="empty" hidden>这一类里还没有作品。</p>
  </section>

</main>

<footer class="site-foot">
  <div class="wrap">
    <span>拾遗馆 · 私人收藏，不作商业用途</span>
    <span>影像与文字版权归原作者 小天才.（余乐彤）所有</span>
  </div>
</footer>

<script src="assets/guard.js"></script>
<script src="data/works.js"></script>
<script src="data/library.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
